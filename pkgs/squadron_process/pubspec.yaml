name: squadron_process
description: >-
  Unofficial Squadron extension: run a Squadron service in another,
  optionally elevated, process over a loopback socket, and report what each
  place can do.
version: 0.9.0
publish_to: none
resolution: workspace
repository: https://github.com/p0g-stack/p0g/tree/main/pkgs/squadron_process

environment:
  # Oldest Dart whose APIs this package uses; CI runs the Dart of the pinned Flutter.
  sdk: ^3.13.4

dependencies:
  # The channel-factory patch in third_party/squadron/patches is
  # written against this release. tool/squadron.sh materializes the patched
  # tree and points pub at it through pubspec_overrides.yaml.
  squadron: ">=7.4.5 <7.5.0"
  cancelation_token: ^1.1.0
  logger: ^2.1.0
  meta: ^1.11.0
  web: ^1.1.0
  patched_source:
    path: ../patched_source
  path: ^1.9.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.30.0
