name: flutter_p0g
description: Builds a stock Flutter app for the WebUI (KernelSU-style module) and AERA targets. Like flutterpi_tool, it is flutter_tools plus a packing step.
version: 0.9.0
publish_to: none
repository: https://github.com/p0g-stack/p0g
resolution: workspace

environment:
  sdk: ^3.14.0
  # The CLI wraps flutter_tools from this SDK.
  flutter: 3.50.0

executables:
  flutter_p0g: flutter_p0g

dependencies:
  crypto: ^3.0.6
  path: ^1.9.0
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
