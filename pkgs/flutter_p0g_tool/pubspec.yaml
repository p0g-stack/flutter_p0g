name: flutter_p0g_tool
description: Flutter SDK integration for the flutter_p0g launcher.
version: 0.9.0
publish_to: none
repository: https://github.com/p0g-stack/p0g

# Resolved separately by the launcher against the selected SDK's flutter_tools
# path. SDK-source packages cannot currently have relative path dependencies.
environment:
  sdk: ^3.14.0
  flutter: 3.50.0

dependencies:
  flutter_tools:
    sdk: flutter
  archive: ^3.6.1
  args: ^2.7.0
  crypto: ^3.0.6
  file: ^7.0.1
  meta: ^1.10.0
  package_config: ^2.1.0
  path: ^1.9.0
  patched_source:
    path: ../patched_source
  unified_analytics: any
  yaml: ^3.1.0
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
