name: p0g_workspace
publish_to: none

environment:
  sdk: ^3.13.0

# The CLI wraps flutter_tools from Flutter 3.47.9; flutter_webui needs
# Flutter >=3.50.0. Resolve pkgs/flutter_p0g separately on its pinned SDK.
workspace:
  - pkgs/patched_source
  - pkgs/squadron_process
  - pkgs/flutter_webui
  - pkgs/flutter_webui_client
  - pkgs/flutter_webui_root
  - web_sdk
  - pkgs/webui/clipboard_webui
  - pkgs/webui/dynamic_color_webui
  - pkgs/webui/file_selector_webui
  - pkgs/webui/flutter_local_notifications_webui
  - pkgs/webui/path_provider_webui
  - pkgs/webui/permission_handler_webui
  - pkgs/webui/share_plus_webui
  - pkgs/webui/shared_preferences_webui
  - pkgs/webui/url_launcher_webui
  - pkgs/webui/webui_app_plane
  - pkgs/p0g_lints

dev_dependencies:
  lints: ^6.0.0
