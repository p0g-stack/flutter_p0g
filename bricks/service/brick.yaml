name: service
description: Adds a Squadron service to a p0g_app workspace, exposed in the CLI (a command and serve) and, by default, the GUI (a panel).
version: 0.5.0
repository: https://github.com/p0g-stack/bricks/tree/main/bricks/service

environment:
  mason: ^0.1.1

vars:
  name:
    type: string
    description: The service name (snake_case), e.g. partitions.
    default: example
    prompt: What is the service called?
  panel:
    type: boolean
    description: Add an app panel for the service.
    default: true
    prompt: Add an app panel for the service?
