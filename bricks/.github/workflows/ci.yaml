name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_P0G_REF: a00aa6af51690ec2353d55621dfd79fd0bccf55c

jobs:
  bricks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand,wasm-pack
      - name: Install pinned flutter_p0g and patched FRB
        run: |
          dart pub global activate --source git https://github.com/p0g-stack/flutter_p0g --git-ref "$FLUTTER_P0G_REF"
          "$HOME/.pub-cache/bin/flutter_p0g" precache --frb --no-webui
      - name: Install mason
        run: |
          dart pub global activate mason_cli 0.1.4
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Generate and test
        run: tool/ci.sh "$RUNNER_TEMP/bricks"
