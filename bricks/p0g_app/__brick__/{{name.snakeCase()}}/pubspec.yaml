name: {{name.snakeCase()}}_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - core
  - app
  - cli

dev_dependencies:
  patched_source:
    git:
      url: https://github.com/p0g-stack/p0g
      path: pkgs/patched_source
      tag_pattern: p0g-v{{=<% %>=}}{{version}}<%={{ }}=%>
    version: ^0.9.0
  path: ^1.9.1
  yaml: ^3.1.3
{{#rust}}  crypto: ^3.0.6
{{/rust}}
