name: {{name.snakeCase()}}
description: The {{name.snakeCase()}} GUI. Flutter on top of the core.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  dynamic_color: ^2.1.0
  material_ui: ^1.0.0
  squadron: ^7.4.5
  squadron_process:
    git:
      url: https://github.com/p0g-stack/p0g
      path: pkgs/squadron_process
      tag_pattern: p0g-v{{=<% %>=}}{{version}}<%={{ }}=%>
    version: ^0.9.0
  flutter_webui_client:
    git:
      url: https://github.com/p0g-stack/p0g
      path: pkgs/flutter_webui_client
      tag_pattern: p0g-v{{=<% %>=}}{{version}}<%={{ }}=%>
    version: ^0.9.0
  {{name.snakeCase()}}_core: any

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
