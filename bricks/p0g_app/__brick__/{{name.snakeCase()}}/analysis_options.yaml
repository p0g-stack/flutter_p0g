include: package:lints/recommended.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
{{#rust}}    - "core/lib/src/rust/**"
{{/rust}}

# p0g conventions as warnings: core never imports Flutter, strategies never
# read kIsWeb or Platform (p0g-stack/p0g pkgs/p0g_lints, released with the
# p0g-v* tags). Members with their own analysis_options.yaml include this
# file to get them.
#
# A plugin source is resolved in a synthetic package the analysis server
# generates (`environment: sdk: ^3.6.0` on Dart 3.14), below the ^3.9.0 that
# `tag_pattern` needs, so the tag is named as `ref:` here.
plugins:
  p0g_lints:
    git:
      url: https://github.com/p0g-stack/p0g
      path: pkgs/p0g_lints
      ref: p0g-v0.9.0
