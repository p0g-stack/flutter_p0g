name: {{name.snakeCase()}}_cli
description: The {{name.snakeCase()}} command line. On WebUI it is also the root process (serve).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

executables:
  {{name.snakeCase()}}: {{name.snakeCase()}}

dependencies:
  args: ^2.7.0
  squadron: ^7.4.5
  {{name.snakeCase()}}_core: any
  squadron_process:
    git:
      url: https://github.com/p0g-stack/p0g
      path: pkgs/squadron_process
      tag_pattern: p0g-v{{=<% %>=}}{{version}}<%={{ }}=%>
    version: ^0.9.0

dev_dependencies:
  flutter_webui_client:
    git:
      url: https://github.com/p0g-stack/p0g
      path: pkgs/flutter_webui_client
      tag_pattern: p0g-v{{=<% %>=}}{{version}}<%={{ }}=%>
    version: ^0.9.0
  flutter_webui_root:
    git:
      url: https://github.com/p0g-stack/p0g
      path: pkgs/flutter_webui_root
      tag_pattern: p0g-v{{=<% %>=}}{{version}}<%={{ }}=%>
    version: ^0.9.0
  lints: ^6.1.0
  test: ^1.31.1
