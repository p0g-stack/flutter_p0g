name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to the same ref supersedes a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.paths.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changes
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # PR checkout is the test merge, so compare its tree with the base.
          # For a new/rewritten main with no reachable base, run everything.
          build=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null &&
             git diff --quiet "$BASE" HEAD -- . ':(exclude)*.md' ':(exclude)docs/**'; then
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Immutable release uploader fixtures
        run: bash .github/scripts/immutable-release-upload-test.sh

  workspace:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      # Workspace members to analyze. Neither bricks/ (Mason templates) nor
      # flutter_p0g (analyzed and tested in the CLI job).
      WORKSPACE_DIRS: >-
        pkgs/patched_source pkgs/squadron_process pkgs/flutter_webui pkgs/flutter_webui_client
        pkgs/flutter_webui_root pkgs/webui pkgs/p0g_lints web_sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pkgs/squadron_process/tool/squadron.sh
      - uses: ./.github/actions/setup
        with:
          precache: web
      # Tracked Dart only, so the materialized upstream checkout and other
      # build output are never traversed; after pub get so each file formats
      # with its resolved language version. The CLI formats in its own job.
      - name: dart format
        run: |
          git ls-files -z -- '*.dart' ':(exclude)bricks/**' ':(exclude)pkgs/flutter_p0g*/**' \
            | xargs -0 -r dart format --output=none --set-exit-if-changed
      - name: patched_source tests
        run: dart test
        working-directory: pkgs/patched_source
      - name: squadron_process VM tests
        run: dart test -p vm
        working-directory: pkgs/squadron_process
      - name: squadron_process example
        run: dart run example/squadron_process_example.dart
        working-directory: pkgs/squadron_process
      - name: squadron_process browser tests (dart2js, dart2wasm)
        working-directory: pkgs/squadron_process
        run: |
          dart test -p chrome test/codec_test.dart test/facts_test.dart
          dart test -p chrome -c dart2wasm test/codec_test.dart test/facts_test.dart
      - name: Squadron suite with the patch
        working-directory: .upstream/squadron
        run: |
          dart pub get
          dart test -p vm test/squadron_vm_test.dart
      - name: flutter_webui_root tests
        run: dart test
        working-directory: pkgs/flutter_webui_root
      - name: flutter_webui_client tests (stock SDK)
        run: dart test
        working-directory: pkgs/flutter_webui_client
      - name: webui_app_plane tests
        run: dart test
        working-directory: pkgs/webui/webui_app_plane
      - name: WebUI plugin tests
        run: |
          for p in file_selector path_provider url_launcher share_plus dynamic_color shared_preferences permission_handler clipboard flutter_local_notifications; do
            (cd pkgs/webui/${p}_webui && flutter test) || exit 1
          done
      - name: Patches apply and compile (patched web SDK)
        run: dart run web_sdk/tool/build_web_sdk.dart --flutter "$FLUTTER_ROOT" --out "$RUNNER_TEMP/patched"
      - name: Use the patched web SDK
        run: |
          cache="$FLUTTER_ROOT/bin/cache"
          rm -rf "$cache/flutter_web_sdk" "$cache/pkg/sky_engine/lib/ui_web"
          cp -R "$RUNNER_TEMP/patched/flutter_web_sdk" "$cache/"
          cp -R "$RUNNER_TEMP/patched/pkg/sky_engine/lib/ui_web" "$cache/pkg/sky_engine/lib/"
      # After the patched SDK: flutter_webui uses its ui_web additions.
      - name: dart analyze
        run: |
          read -ra dirs <<< "$WORKSPACE_DIRS"
          dart analyze --fatal-infos "${dirs[@]}"
      - name: flutter_webui tests
        run: flutter test
        working-directory: pkgs/flutter_webui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-webui-web-sdk
          path: ${{ runner.temp }}/patched

  cli:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pkgs/squadron_process/tool/squadron.sh
      - uses: ./.github/actions/setup
      - name: Resolve the CLI engine against this flutter_tools
        run: |
          flutter --version
          pkgs/flutter_p0g_tool/tool/resolve.sh
      - name: Format launcher and engine
        run: |
          git ls-files -z -- 'pkgs/flutter_p0g*/*.dart' |
            xargs -0 -r dart format --output=none --set-exit-if-changed
      - run: dart analyze --fatal-infos
        working-directory: pkgs/flutter_p0g
      - run: dart analyze --fatal-infos
        working-directory: pkgs/flutter_p0g_tool
      - run: dart test
        working-directory: pkgs/flutter_p0g
      - run: dart test
        working-directory: pkgs/flutter_p0g_tool

  patches:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out and re-export each carried series
        run: |
          for series in third_party/*/ web_sdk; do
            upstream=$(basename "$series")
            tool/patches.sh "$upstream" checkout
            tool/patches.sh "$upstream" export
            status=$(git status --porcelain --untracked-files=all)
            if [[ -n "$status" ]]; then
              printf '%s round trip changed the checkout:\n%s\n' "$upstream" "$status" >&2
              exit 1
            fi
          done

  bricks:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          wasm: 'true'
          pub-get: 'false'
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      # The generator uses an unpublished local tag and resolves the generated
      # app outside the workspace, including before p0g's first release.
      - name: Generate and test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bricks/tool/ci.sh "$RUNNER_TEMP/bricks"

  # Require only this check. In particular, a failed changes job followed by
  # skipped builds is not a successful documentation-only run.
  gate:
    name: p0g CI
    needs: [changes, workspace, cli, patches, bricks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all expected results
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.changes.outputs.build }}
          RESULTS: ${{ needs.workspace.result }} ${{ needs.cli.result }} ${{ needs.patches.result }} ${{ needs.bricks.result }}
        run: |
          [[ "$CHANGES" == success ]]
          case "$BUILD" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          for result in $RESULTS; do [[ "$result" == "$expected" ]]; done
