name: ci
on:
  push:
  pull_request:
# A newer push to the same ref supersedes a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: flutter test
      - name: frb series applies to the pinned commit
        run: |
          FRB_COMMIT=$(awk -F "'" '/^const kFrbCommit = / {print $2}' lib/src/frb/frb.dart)
          test "${#FRB_COMMIT}" = 40
          git init -q /tmp/frb && cd /tmp/frb
          git remote add origin https://github.com/fzyzcjy/flutter_rust_bridge
          git fetch -q --depth 1 origin "$FRB_COMMIT"
          git checkout -q FETCH_HEAD
          for p in "$GITHUB_WORKSPACE"/patches/frb/*.patch; do git apply --check "$p" && git apply "$p"; done
