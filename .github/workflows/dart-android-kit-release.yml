# Publishes the kits a dart-android-kit run uploaded as artifacts, without
# rebuilding them, as the dart-android-<Dart>-<full commit SHA> release, where
# the commit is the one the selected build run built and Dart is the version
# its artifacts carry. Before anything is published, the run must be this
# repository's successful dart-android-kit run, and each ABI's provenance.json
# must name that run, its commit, the Dart version and the downloaded kit's
# sha256; the kit's own VERSION and ABI must match too. The checked files go
# through immutable-upload.yml (.github/scripts/immutable-release-upload.sh):
# identical bytes are skipped, different bytes fail; a rebuilt kit needs a new
# commit. Older dart-android-* releases stay as they are.
name: dart-android-kit-release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: dart-android-kit run whose artifacts to publish
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      tag: ${{ steps.run.outputs.tag }}
      commit: ${{ steps.run.outputs.commit }}
      dart: ${{ steps.run.outputs.dart }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Check the build run
        id: run
        run: |
          set -euo pipefail
          [[ $RUN_ID =~ ^[0-9]+$ ]] || { echo "::error::run_id must be a run number, got '$RUN_ID'"; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/dart-android-kit.yml" -q .id)
          jq '{repository: .repository.full_name, head_repository: .head_repository.full_name, workflow_id, path,
               event, status, conclusion, head_sha, run_attempt}' <<<"$run"
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" --argjson workflow "$workflow" \
              '.repository.full_name == $repo and .head_repository.full_name == $repo and .workflow_id == $workflow
               and .status == "completed" and .conclusion == "success"' <<<"$run" >/dev/null; then
            echo "::error::run $RUN_ID is not a successful dart-android-kit run of $GITHUB_REPOSITORY"
            exit 1
          fi
          sha=$(jq -r .head_sha <<<"$run")
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::run $RUN_ID has no full head SHA"; exit 1; }
          # The Dart version: the one both ABI artifacts of the run are named for.
          dart=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" -q '.artifacts[].name' |
            sed -n 's/^dart-android-\(arm64-v8a\|x86_64\)-//p' | sort | uniq -c | awk '$1 == 2 {print $2}')
          [[ $dart =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::run $RUN_ID has no single Dart version with both ABI artifacts (got '${dart//$'\n'/ }')"; exit 1; }
          {
            echo "commit=$sha"
            echo "dart=$dart"
            echo "tag=dart-android-$dart-$sha"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: dart-android-arm64-v8a-${{ steps.run.outputs.dart }}
          path: ${{ runner.temp }}/kits
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: dart-android-x86_64-${{ steps.run.outputs.dart }}
          path: ${{ runner.temp }}/kits
      - name: Check the kits
        working-directory: ${{ runner.temp }}/kits
        env:
          PRODUCER_SHA: ${{ steps.run.outputs.commit }}
          DART_VERSION: ${{ steps.run.outputs.dart }}
        run: |
          set -euo pipefail
          ls -la
          for abi in arm64-v8a x86_64; do
            name=dart-android-$abi-$DART_VERSION.tar.gz
            manifest=dart-android-$abi-$DART_VERSION.provenance.json
            test -f "$name" && test -f "$name.sha256" && test -f "$manifest"
            sha256sum -c "$name.sha256"
            cat "$manifest"
            if ! jq -e --arg repo "$GITHUB_REPOSITORY" --arg run_id "$RUN_ID" --arg commit "$PRODUCER_SHA" \
                --arg dart "$DART_VERSION" --arg abi "$abi" --arg asset "$name" --arg sha256 "$(sha256sum < "$name" | cut -c1-64)" \
                '.repository == $repo and (.workflow | startswith($repo + "/.github/workflows/dart-android-kit.yml@"))
                 and .run_id == $run_id and .commit == $commit and .dart_version == $dart and .abi == $abi
                 and .asset == $asset and .sha256 == $sha256' "$manifest" >/dev/null; then
              echo "::error::$manifest does not match run $RUN_ID ($PRODUCER_SHA), Dart $DART_VERSION, $abi and the downloaded $name"
              exit 1
            fi
            test "$(tar -xzOf "$name" VERSION)" = "$DART_VERSION"
            test "$(tar -xzOf "$name" ABI)" = "$abi"
          done
      # Only what was checked, flat, for the publish job of this run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dart-android-release
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/kits/dart-android-arm64-v8a-${{ steps.run.outputs.dart }}.tar.gz
            ${{ runner.temp }}/kits/dart-android-arm64-v8a-${{ steps.run.outputs.dart }}.tar.gz.sha256
            ${{ runner.temp }}/kits/dart-android-x86_64-${{ steps.run.outputs.dart }}.tar.gz
            ${{ runner.temp }}/kits/dart-android-x86_64-${{ steps.run.outputs.dart }}.tar.gz.sha256
  publish:
    needs: check
    permissions:
      contents: write
    uses: ./.github/workflows/immutable-upload.yml
    with:
      artifact: dart-android-release
      files: |
        dart-android-arm64-v8a-${{ needs.check.outputs.dart }}.tar.gz
        dart-android-arm64-v8a-${{ needs.check.outputs.dart }}.tar.gz.sha256
        dart-android-x86_64-${{ needs.check.outputs.dart }}.tar.gz
        dart-android-x86_64-${{ needs.check.outputs.dart }}.tar.gz.sha256
      tag: ${{ needs.check.outputs.tag }}
      commit: ${{ needs.check.outputs.commit }}
      title: ${{ needs.check.outputs.tag }}
      notes: >-
        Android Dart ${{ needs.check.outputs.dart }} kits (arm64-v8a, x86_64) built by dart-android-kit
        run ${{ inputs.run_id }} at ${{ needs.check.outputs.commit }}. Assets are never replaced.
