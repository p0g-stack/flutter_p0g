# Builds the Android Dart kits that `flutter_p0g precache --dart-android`
# fetches, one per device ABI: gen_snapshot (linux-x64 host, emits Android
# AOT for that ABI) and dartaotruntime (Android, bionic), from the Dart
# release inside the pinned Flutter. Same recipe Termux uses for its dart
# package (tools/build.py --os android), keeping the host gen_snapshot.
# x86_64 is for emulators (devicelab's AVD). Product mode, to match the
# product kernel build webui snapshots. The `gen_snapshot` target alone
# builds the Android one; the host cross-compiler comes from the
# runtime_precompiled group (gen_snapshot($host_toolchain), under clang_x64/).
name: dart-android-kit
on:
  workflow_dispatch:
    inputs:
      dart_version:
        description: Dart release (must match the pinned Flutter's dart-sdk/version)
        default: 3.13.4
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: arm64
            out: ProductAndroidARM64
            elf: aarch64
          - abi: x86_64
            arch: x64
            out: ProductAndroidX64
            elf: x86-64
    steps:
      - name: Fetch Dart SDK sources
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> "$GITHUB_PATH"
          export PATH="$PWD/depot_tools:$PATH"
          mkdir dart && cd dart
          git clone --branch "${{ inputs.dart_version }}" --depth 1 --no-tags https://dart.googlesource.com/sdk.git sdk
          gclient config --name sdk --custom-var download_android_deps=True --unmanaged https://dart.googlesource.com/sdk.git
          gclient sync --jobs 8 --no-history
      - name: Build
        working-directory: dart/sdk
        run: ./tools/build.py --no-rbe --mode product --arch ${{ matrix.arch }} --os android dartaotruntime runtime_precompiled
      - name: Pack
        working-directory: dart/sdk
        run: |
          out=out/${{ matrix.out }}
          find "$out" -maxdepth 3 -type f \( -name 'gen_snapshot*' -o -name 'dartaotruntime*' -o -name 'dart_precompiled_runtime*' \) -exec file {} \;
          # Host gen_snapshot: an x86-64 ELF not linked for Android. Runtime:
          # the ABI's ELF that is (interpreter /system/bin/linker64).
          hosts=$(find "$out" -maxdepth 3 -type f -name gen_snapshot -exec file {} \; | grep -v 'Android\|linker64' | grep x86-64 || true)
          gen=$( (echo "$hosts" | grep ', stripped'; echo "$hosts") | head -1 | cut -d: -f1)
          rt=$(find "$out/exe.stripped" "$out" -maxdepth 1 -type f \( -name dartaotruntime -o -name dartaotruntime_product -o -name dart_precompiled_runtime_product \) -exec file {} \; | grep '${{ matrix.elf }}' | grep 'Android\|linker64' | head -1 | cut -d: -f1)
          test -n "$gen" && test -n "$rt"
          mkdir kit
          cp "$gen" kit/gen_snapshot
          cp "$rt" kit/dartaotruntime
          echo "${{ inputs.dart_version }}" > kit/VERSION
          echo "${{ matrix.abi }}" > kit/ABI
          file kit/gen_snapshot kit/dartaotruntime
          name=dart-android-${{ matrix.abi }}-${{ inputs.dart_version }}.tar.gz
          tar czf "$name" -C kit VERSION ABI gen_snapshot dartaotruntime
          sha256sum "$name" | tee "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dart-android-${{ matrix.abi }}-${{ inputs.dart_version }}
          path: dart/sdk/dart-android-*.tar.gz*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dart-android-${{ inputs.dart_version }}
          files: dart/sdk/dart-android-*.tar.gz*
